# ============================================================
# Job Tracker — Application Configuration
# ============================================================
# Values like ${DB_HOST:localhost} mean:
#   "Use the DB_HOST environment variable if set,
#    otherwise fall back to 'localhost'."
# This keeps secrets out of source code.
# ============================================================

server:
  port: ${SERVER_PORT:${PORT:8080}}

spring:
  application:
    name: job-tracker

  servlet:
    multipart:
      max-file-size: ${ATTACHMENT_MAX_SIZE:10MB}
      max-request-size: ${ATTACHMENT_MAX_REQUEST_SIZE:11MB}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
          starttls:
            enable: ${SMTP_STARTTLS:false}

  # --- Database connection pool (HikariCP, the Spring Boot default) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobtracker}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # Driver class is auto-detected from the URL — no need to specify it.

  # --- JPA / Hibernate settings ---
  jpa:
    hibernate:
      # "validate" = Hibernate checks that entities match the DB schema
      # but never modifies tables. Flyway handles all schema changes.
      # If an entity is out of sync with the DB, the app fails fast at
      # startup — much better than silent data corruption.
      ddl-auto: validate
    show-sql: false
    # Disable Open-Session-In-View to avoid lazy-loading pitfalls.
    # Forces us to fetch all needed data inside the service layer,
    # which is a best practice for clean architecture.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Optional git-ignored file for local secrets (JWT_SECRET, etc.).
  # Environment variables still win if they are set.
  config:
    import: optional:classpath:application-local.yml

# jwt.secret is NOT in this file. Set JWT_SECRET in the environment, or put
# jwt.secret in git-ignored application-local.yml (see the .example file).
# HS256 needs at least 32 characters.
jwt:
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Browser origin allowed to call the API.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  attachments:
    storage-path: ${ATTACHMENT_STORAGE_PATH:uploads}
    max-size-bytes: ${ATTACHMENT_MAX_SIZE_BYTES:10485760}
  reminders:
    enabled: ${REMINDERS_ENABLED:false}
    cron: ${REMINDER_CRON:0 0 * * * *}
    from: ${MAIL_FROM:no-reply@jobtracker.local}
