
services:
  - type: web
    name: job-tracker-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/db

    envVars:
      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "5432"

      - key: DB_NAME
        sync: false

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: ATTACHMENT_STORAGE_PATH
        value: /app/uploads

      - key: REMINDERS_ENABLED
        value: "false"
